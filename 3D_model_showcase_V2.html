<!DOCTYPE html>
<html>
<title>3D Models</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

<!-- css -->
<style>
    .Kuvat {
        display: none
    }

    .w3-left,
    .w3-right,
    .w3-badge {
        cursor: pointer
    }

    .w3-badge {
        height: 13px;
        width: 13px;
        padding: 0
    }

    h1 {
        color: chartreuse;
    }

    #big_container {
        border: aqua 7px groove;
        width: 90%;
        height: auto;
        margin: auto;
        padding: 15px;
        cursor: pointer;
    }

    .text_container {
        position: relative;
        float: left;
        left: 0%;
        width: 40%;
        margin: 1%;
    }

    .img_container {
        position: relative;
        overflow: auto;
        left: 5%;
        border: 7px groove;
        width: 50%;
        margin: 1%;
    }

    .image {
        display: block;
        width: 100%;
        height: auto;
    }

    .overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
    }

    .img_container:hover .overlay {
        opacity: 1;
    }
</style>


<!-- First container with set of images -->

<!-- Visible elements -->

<body>
    <div id="big_container">
        <h1>Fade in Overlay</h1>
        <p>Hover over the image to see the effect.</p>

        <div class="text_container">
            <h2>Header for FIRST image</h2>
            <p>Some example text on the FIRST image...</p>
        </div>
        <div class="img_container">
            <div class="w3-content w3-display-container" style="max-width:800px">
                <img class="Kuvat" src="images\video0001-0120.gif" style="width:100%">
                <img class="Kuvat" src="images\Laatikko_Still_1080.png" style="width:100%">
                <img class="Kuvat" src="images\kiertokanki.jpg" style="width:100%">
                <div class="w3-center w3-container w3-section w3-large w3-text-white w3-display-bottommiddle"
                    style="width:100%">
                    <div class="w3-left w3-hover-text-khaki" onclick="plusDivs(-1)">&#10094;</div>
                    <div class="w3-right w3-hover-text-khaki" onclick="plusDivs(1)">&#10095;</div>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(1)"></span>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(2)"></span>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(3)"></span>
                </div>
            </div>

            <div class="w3-content" style="max-width:1200px">
                <div class="w3-row-padding w3-section">
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\video0001-0120.gif"
                            style="width:100%;cursor:pointer" onclick="currentDiv(1)">
                    </div>
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\Laatikko_Still_1080.png"
                            style="width:100%;cursor:pointer" onclick="currentDiv(2)">
                    </div>
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\kiertokanki.jpg"
                            style="width:100%;cursor:pointer" onclick="currentDiv(3)">
                    </div>
                </div>
            </div>
        </div>

        <div class="text_container">
            <h2>Header for SECOND image</h2>
            <p>Some example text on the SECOND image...</p>
        </div>
        <div class="img_container">
            <div class="w3-content w3-display-container" style="max-width:800px">
                <img class="Kuvat" src="images\Laatikko_Still_1080.png" style="width:100%">
                <img class="Kuvat" src="images\rock.PNG" style="width:100%">
                <img class="Kuvat" src="images\video0001-0120.gif" style="width:100%">
                <div class="w3-center w3-container w3-section w3-large w3-text-white w3-display-bottommiddle"
                    style="width:100%">
                    <div class="w3-left w3-hover-text-khaki" onclick="plusDivs(-1)">&#10094;</div>
                    <div class="w3-right w3-hover-text-khaki" onclick="plusDivs(1)">&#10095;</div>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(1)"></span>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(2)"></span>
                    <span class="w3-badge demo w3-border w3-transparent w3-hover-white" onclick="currentDiv(3)"></span>
                </div>
            </div>

            <div class="w3-content" style="max-width:1200px">
                <div class="w3-row-padding w3-section">
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\Laatikko_Still_1080.png"
                            style="width:100%;cursor:pointer" onclick="currentDiv(1)">
                    </div>
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\rock.PNG"
                            style="width:100%;cursor:pointer" onclick="currentDiv(2)">
                    </div>
                    <div class="w3-col s4">
                        <img class="demo w3-opacity w3-hover-opacity-off" src="images\video0001-0120.gif"
                            style="width:100%;cursor:pointer" onclick="currentDiv(3)">
                    </div>
                </div>
            </div>
        </div>

        <div class="text_container">
            <h2>Header for THIRD image</h2>
            <p>Some example text on the THIRD image...</p>
        </div>
        <div class="img_container">
            <img src="images\Laatikko_Still_1080.png" class="image" />
            <div class="overlay">
                <img src="images\Laatikko.gif" class="image" />
            </div>
        </div>
    </div>
</body>


<!-- Javascript -->
<script>
    var slideIndex = 1;
    showDivs(slideIndex);

    function plusDivs(n) {
        showDivs(slideIndex += n);
    }

    function currentDiv(n) {
        showDivs(slideIndex = n);
    }

    function showDivs(n) {
        var i;
        var x = document.getElementsByClassName("Kuvat");
        var dots = document.getElementsByClassName("demo");
        if (n > x.length) { slideIndex = 1 }
        if (n < 1) { slideIndex = x.length }
        for (i = 0; i < x.length; i++) {
            x[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" w3-white", "");
        }
        x[slideIndex - 1].style.display = "block";
        dots[slideIndex - 1].className += " w3-white";
    }
</script>

</body>

</html>
